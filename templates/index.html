<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Organizer - Календарь</title>
    <style>
        body {
            background-color: #0d0f18;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h2 {
            margin-bottom: 20px;
        }
        /* Сетка календаря (пример) */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            max-width: 900px;
        }
        .calendar-day {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            min-height: 80px;
            cursor: pointer;
            transition: 0.2s;
        }
        .calendar-day:hover {
            border-color: #58a6ff;
            background-color: #1f242c;
        }
        .day-number {
            font-weight: bold;
            color: #8b949e;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 12px;
            width: 400px;
        }
        .modal-content textarea {
            width: 100%;
            height: 100px;
            background-color: #0d0f18;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 6px;
            padding: 10px;
            resize: none;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        .btn-cancel {
            background-color: #30363d;
            color: #fff;
        }
        .btn-save {
            background-color: #238636;
            color: #fff;
        }

        /* Список сохраненных заметок на странице */
        .notes-section {
            margin-top: 40px;
            max-width: 900px;
        }
        .note-item {
            background: #161b22;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid #238636;
        }
    </style>
</head>
<body>

    <h2>Календарь событий (Сентябрь 2026)</h2>

    <!-- Сетка дней календаря -->
    <div class="calendar-grid">
        <!-- Пример дней, можно генерировать динамически через цикл Jinja2 -->
        <div class="calendar-day" onclick="openModal('2026-09-01 12:00:00', '1 Сентября 2026')">
            <div class="day-number">1</div>
        </div>
        <div class="calendar-day" onclick="openModal('2026-09-02 12:00:00', '2 Сентября 2026')">
            <div class="day-number">2</div>
        </div>
        <div class="calendar-day" onclick="openModal('2026-09-03 12:00:00', '3 Сентября 2026')">
            <div class="day-number">3</div>
        </div>
    </div>

    <!-- Список уже существующих заметок из data.json -->
    <div class="notes-section">
        <h3>Сохраненные задачи:</h3>
        {% if notes %}
            {% for note in notes %}
                <div class="note-item">
                    <strong>📅 {{ note.run_date }}</strong>
                    <p>{{ note.content }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p style="color: #8b949e;">Пока нет ни одной заметки.</p>
        {% endif %}
    </div>

    <!-- Модальное окно -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <form action="/add_note" method="POST">
                <h3 id="modalTitle">Событие</h3>
                
                <!-- Сюда JavaScript подставит точную дату -->
                <input type="hidden" name="run_date" id="selectedDateInput">
                
                <textarea name="content" placeholder="Введите заметку или задачу..." required></textarea>
                
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn-cancel">Отмена</button>
                    <button type="submit" class="btn-save">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal(dateStr, titleStr) {
            document.getElementById('selectedDateInput').value = dateStr;
            document.getElementById('modalTitle').innerText = titleStr;
            document.getElementById('eventModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
        }
    </script>

</body>
</html>
