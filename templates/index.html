<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Organizer - Расписание</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="logo">Organizer</div>
        <ul class="nav-links">
            <li class="active"><a href="/">Расписание</a></li>
            <li><a href="/calendar">Календарь</a></li>
            <li><a href="/settings">Настройки</a></li>
        </ul>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        <div class="header-container">
            <h2>Расписание занятий</h2>
            <button class="btn-primary" onclick="openModal()">+ Добавить занятие</button>
        </div>

        <div class="schedule-list">
            {% if notes %}
                {% for note in notes %}
                    <div class="schedule-item">
                        <span class="schedule-date">📅 {{ note.run_date }}</span>
                        <p class="schedule-text">{{ note.content }}</p>
                    </div>
                {% endfor %}
            {% else %}
                <p style="color: var(--text-muted);">Пока нет добавленных занятий.</p>
            {% endif %}
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <form action="/add_note" method="POST">
                <h3 style="margin-top:0;">Добавить занятие</h3>
                <label style="font-size: 12px; color: var(--text-muted);">Дата и время:</label>
                <input type="datetime-local" name="run_date" required class="form-input">
                
                <textarea name="content" placeholder="Описание занятия, аудитория..." required class="form-textarea"></textarea>
                
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn-cancel">Отмена</button>
                    <button type="submit" class="btn-save">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
