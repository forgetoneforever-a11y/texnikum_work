<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Organizer - Расписание</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --sidebar-bg: #121520;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --text-main: #ffffff;
            --text-muted: #8b949e;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }
        .sidebar {
            width: 240px; background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px;
        }
        .logo { font-size: 20px; font-weight: bold; color: var(--accent-color); margin-bottom: 40px; }
        .nav-links { list-style: none; padding: 0; margin: 0; }
        .nav-links li {
            padding: 12px 15px; margin-bottom: 8px; border-radius: 8px;
            cursor: pointer; color: var(--text-muted); transition: 0.2s;
        }
        .nav-links li a { color: inherit; text-decoration: none; display: block; }
        .nav-links li.active, .nav-links li:hover {
            background-color: rgba(88, 166, 255, 0.1); color: var(--text-main);
        }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h2 { margin: 0; font-size: 24px; }
        
        .btn-primary {
            background-color: #238636; color: #fff; border: none;
            padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .btn-primary:hover { background-color: #2ea043; }

        .schedule-list { display: flex; flex-direction: column; gap: 10px; max-width: 900px; }
        .schedule-item {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 15px 20px; border-radius: 8px; border-left: 4px solid var(--accent-color);
        }

        /* Модальное окно */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            padding: 25px; border-radius: 12px; width: 400px;
        }
        .modal-content textarea, .modal-content input {
            width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color);
            color: #fff; border-radius: 6px; padding: 10px; box-sizing: border-box; margin-top: 10px;
        }
        .modal-content textarea { height: 100px; resize: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-cancel { background-color: var(--border-color); color: #fff; }
        .btn-save { background-color: #238636; color: #fff; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">Organizer</div>
        <ul class="nav-links">
            <li class="active"><a href="/">Расписание</a></li>
            <li><a href="/calendar">Календарь</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-container">
            <h2>Расписание занятий</h2>
            <button class="btn-primary" onclick="openModal()">+ Добавить занятие</button>
        </div>

        <div class="schedule-list">
            {% if notes %}
                {% for note in notes %}
                    <div class="schedule-item">
                        <strong style="color: var(--accent-color);">📅 {{ note.run_date }}</strong>
                        <p style="margin: 8px 0 0 0;">{{ note.content }}</p>
                    </div>
                {% endfor %}
            {% else %}
                <p style="color: var(--text-muted);">Пока нет добавленных занятий или расписания.</p>
            {% endif %}
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <form action="/add_note" method="POST">
                <h3 style="margin-top:0;">Добавить занятие</h3>
                <label style="font-size: 12px; color: var(--text-muted);">Дата и время:</label>
                <input type="datetime-local" name="run_date" required>
                
                <textarea name="content" placeholder="Описание занятия..." required style="margin-top: 15px;"></textarea>
                
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn-cancel">Отмена</button>
                    <button type="submit" class="btn-save">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('eventModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
        }
    </script>
</body>
</html>
